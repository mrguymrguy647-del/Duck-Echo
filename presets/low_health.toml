# Low health: a muffled double heartbeat.
version = 0
name = "low_health"
description = "Muffled heartbeat for low health."
tags = ["alert", "heartbeat", "low"]

[master]
normalize = true
normalize_peak_db = -4.4
trim_silence = true

[[layers]]
source = "sine"
envelope = { attack = 0.004, decay = 0.12 }
pitch = { start = 60, end = 45, curve = "exponential" }
filter = { kind = "lowpass", cutoff = 300 }

[[layers]]
source = "sine"
volume = 0.6
offset = 0.18
envelope = { attack = 0.004, decay = 0.15 }
pitch = { start = 60, end = 45, curve = "exponential" }
filter = { kind = "lowpass", cutoff = 300 }
