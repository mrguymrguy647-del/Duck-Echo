# UI cancel: two falling pulse notes, E5 then A4, mellowed by a lowpass.
version = 0
name = "ui_cancel"
description = "Two falling notes for back or cancel."
tags = ["ui", "cancel", "negative"]

[master]
normalize = true
normalize_peak_db = -10.8
trim_silence = true

[[layers]]
source = "square"
duty = 0.25
envelope = { attack = 0.002, hold = 0.04, decay = 0.08 }
pitch = { start = "E5" }
filter = { kind = "lowpass", cutoff = 3000 }

[[layers]]
source = "square"
duty = 0.25
offset = 0.07
envelope = { attack = 0.002, hold = 0.04, decay = 0.12 }
pitch = { start = "A4" }
filter = { kind = "lowpass", cutoff = 3000 }
