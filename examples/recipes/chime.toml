# UI confirm chime: two soft sine notes a fifth apart, written as note
# names, with a short room. Shows note-name pitches and a release tail.
version = 0
name = "chime"

[master]
trim_silence = true

[[layers]]
name = "low"
source = "sine"
volume = 0.5

[layers.envelope]
attack = 0.005
hold = 0.04
decay = 0.08
sustain = 0.4
sustain_time = 0.05
release = 0.25

[layers.pitch]
start = "E5"

[[layers]]
name = "high"
source = "sine"
volume = 0.45
offset = 0.09

[layers.envelope]
attack = 0.005
hold = 0.05
decay = 0.1
sustain = 0.35
sustain_time = 0.05
release = 0.35

[layers.pitch]
start = "B5"

[layers.pitch.vibrato]
rate = 5
depth = 0.1
delay = 0.15

[[effects]]
type = "reverb"
size = 0.4
decay = 0.8
damping = 0.6
mix = 0.25
