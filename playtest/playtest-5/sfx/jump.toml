# Jump: a quick upward pulse sweep with a closing filter.
version = 0
name = "jump"
description = "Copy of the jump preset."
tags = ["movement", "jump", "rising", "short"]

[master]
trim_silence = true
normalize_lufs = -20

[[layers]]
source = "square"
duty = 0.3
envelope = { attack = 0.005, hold = 0.05, decay = 0.15 }
pitch = { start = 220, end = 990, curve = "exponential", sweep_time = 0.12 }
filter = { kind = "lowpass", cutoff = 6000, cutoff_end = 1500, resonance = 1.2 }
