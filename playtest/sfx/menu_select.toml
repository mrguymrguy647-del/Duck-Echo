version = 0
name = "menu_select"
description = "Short two-step blip to confirm a menu choice."
tags = ["ui", "menu", "select"]

[master]
normalize = true
normalize_peak_db = -19.0
trim_silence = true

[[layers]]
duty = 0.5
source = "square"

[layers.envelope]
attack = 0.002
decay = 0.09
hold = 0.03

[layers.filter]
cutoff = 5000
kind = "lowpass"

[layers.pitch]
start = "E6"

[layers.pitch.arpeggio]
repeat = false
step_time = 0.05
steps = [0, 5]
