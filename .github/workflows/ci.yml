# Tests on Linux and Windows, and a check that both render every example
# and preset to exactly the same bytes (roadmap task 8).
name: CI

# Runs on every push (any branch, so a branch is checked before its pull
# request) and by hand from the Actions tab.
on:
  push:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test and render (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # Git Bash on Windows, so one script works on both systems.
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      # The Duck Ear's tests run its stub, a Python program.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The real Ear's own tests (ear/tests), without its models: reading
      # WAVs, resampling, the protocol, the network guard. Its three
      # libraries only; no PyTorch.
      - name: The Duck Ear's Python tests
        run: |
          python -m pip install --quiet "numpy>=1.26" "onnxruntime>=1.18" "tokenizers>=0.19"
          python -m unittest discover -s ear/tests -v

      - name: Formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check

      - name: Clippy (no warnings allowed)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: All tests
        run: cargo test --workspace
        env:
          # The Ear's stub tests fail, rather than skip, without Python.
          DUCK_ECHO_REQUIRE_PYTHON: "1"

      # The Ear must work with no network at all (docs/phase4-design.md,
      # section 5): its tests run again in a network namespace that has
      # none, not even the loopback's way out.
      - name: The Ear's tests with no network (Linux)
        if: runner.os == 'Linux'
        run: |
          cargo test -p duck-echo-ear --no-run
          sudo unshare --net -- sudo -u "$USER" env "PATH=$PATH" "HOME=$HOME" \
            DUCK_ECHO_REQUIRE_PYTHON=1 cargo test --offline -p duck-echo-ear
          sudo unshare --net -- sudo -u "$USER" env "PATH=$PATH" "HOME=$HOME" \
            python -m unittest discover -s ear/tests

      - name: Render every example and preset, and hash each WAV
        run: |
          cargo build --release -p duck-echo-cli
          scripts/render-fingerprints.sh renders
          cat renders/SHA256SUMS
          cat renders/OGGSUMS

      - name: Upload the hashes
        uses: actions/upload-artifact@v4
        with:
          name: sha256-${{ runner.os }}
          path: |
            renders/SHA256SUMS
            renders/OGGSUMS

  same-bytes:
    name: Linux and Windows renders match
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: sha256-*

      - name: Compare the two lists of hashes
        run: |
          echo "Linux:   $(wc -l < sha256-Linux/SHA256SUMS) files"
          echo "Windows: $(wc -l < sha256-Windows/SHA256SUMS) files"
          if diff -u sha256-Linux/SHA256SUMS sha256-Windows/SHA256SUMS; then
            echo "Every WAV is byte-identical on Linux and Windows."
          else
            echo "::error::Some renders differ between Linux and Windows (see the diff above). Fix the cause in duck-echo-synth's math module, not in this check."
            exit 1
          fi

      # OGG music is not promised to be the same bytes on both systems
      # (docs/phase3-design.md, question 3): this says whether it is, and
      # never fails the build. The WAVs above are the pinned renders.
      - name: Compare the OGG music (reported, not required)
        run: |
          if diff -u sha256-Linux/OGGSUMS sha256-Windows/OGGSUMS; then
            echo "::notice::The OGG music is byte-identical on Linux and Windows."
          else
            echo "::warning::The OGG music differs between Linux and Windows (see above). Expected: it is checked by its decoded samples, not its bytes."
          fi
