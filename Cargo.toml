[workspace]
resolver = "2"
members = [
    "crates/duck-echo-core",
    "crates/duck-echo-audio",
    "crates/duck-echo-synth",
    "crates/duck-echo-analyze",
    "crates/duck-echo-tools",
    "crates/duck-echo-live",
    "crates/duck-echo-cli",
    "crates/duck-echo-mcp",
    "crates/duck-echo-ear",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
# 1.87: vorbis_rs (the OGG encoder) needs it, and Duck Forge needs it too.
rust-version = "1.87"
repository = "https://github.com/mrguymrguy647-del/Duck-Echo"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
toml_edit = "0.25"
schemars = "1"
serde_path_to_error = "0.1"
strsim = "0.11"
hound = "3.5"
# Unpacks zip files (uv and llama.cpp come as zip files) for the Duck
# Ear's installer. Pure Rust, no dependencies of its own.
miniz_oxide = { version = "0.8", default-features = false, features = ["with-alloc"] }
# OGG Vorbis: vorbis_rs encodes (Xiph's libvorbis with the aoTuV tuning,
# built from C), lewton decodes (pure Rust, the decoder Duck Forge uses).
# The default features of vorbis_rs pick a random stream serial; Duck Echo
# sets its own, so they are off.
vorbis_rs = { version = "0.5", default-features = false }
lewton = "0.10"
clap = { version = "4", features = ["derive"] }

duck-echo-core = { path = "crates/duck-echo-core" }
duck-echo-audio = { path = "crates/duck-echo-audio", default-features = false }
duck-echo-synth = { path = "crates/duck-echo-synth" }
duck-echo-analyze = { path = "crates/duck-echo-analyze" }
duck-echo-tools = { path = "crates/duck-echo-tools" }
duck-echo-live = { path = "crates/duck-echo-live" }
duck-echo-ear = { path = "crates/duck-echo-ear" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.test]
opt-level = 1
