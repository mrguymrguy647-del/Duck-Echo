[package]
name = "duck-echo-tools"
description = "Duck Echo operations shared by the CLI and the MCP server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
duck-echo-core = { workspace = true }
duck-echo-audio = { workspace = true, features = ["wav", "ogg"] }
duck-echo-synth = { workspace = true }
duck-echo-analyze = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
toml = { workspace = true }
# Changes the values inside a TOML file's text, so the comments, blank
# lines and layout a person wrote survive every command.
toml_edit = { workspace = true }

[dev-dependencies]
duck-echo-audio = { workspace = true, features = ["wav", "ogg"] }

[lints]
workspace = true
