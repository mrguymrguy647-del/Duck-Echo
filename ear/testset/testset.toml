true = ["a cheerful rising jingle"]
wrong = ["an explosion", "footsteps", "wind blowing"]

[[sound]]
file = "preset:powerup"
true = ["a rising power-up sound"]
wrong = ["an explosion", "footsteps", "a heavy thud"]

[[sound]]
file = "../../examples/recipes/fanfare.toml"
true = ["a short victory fanfare"]
wrong = ["an explosion", "footsteps", "wind blowing"]

# ---- Soft and harsh ----------------------------------------------------

