# The Duck Ear's test set: sounds made by Duck Echo, each with texts that
# are true for it and texts that are wrong for it. `duck-echo ear check`
# renders every sound, asks the Ear to score every text, and measures how
# often the Ear gets them right (docs/phase4-design.md, section 8). The
# results are in docs/ear-check.md.
#
# `file` is a preset (`preset:coin`), an example song
# (`example:duck_craft_day`), a recipe or song file named from this folder
# (`coin_soft.toml`, `../../examples/recipes/chime.toml`), or `silence`
# (one second of nothing).
#
# `group` puts sounds side by side for the measures that compare two
# sounds: "soft/harsh" and "calm/tense" pairs.

version = 1

# ---- Pickups -----------------------------------------------------------

[[sound]]
file = "preset:coin"
true = ["a coin pickup", "a short bright game pickup sound"]
wrong = ["an explosion", "footsteps", "wind blowing", "a heavy thud", "an engine hum"]

[[sound]]
file = "../../examples/recipes/coin.toml"
true = ["a coin pickup", "a short bright game pickup sound"]
wrong = ["an explosion", "footsteps", "wind blowing", "a heavy thud", "calm music"]

[[sound]]
file = "preset:gem"
true = ["a sparkly pickup sound"]
wrong = ["an explosion", "footsteps", "a heavy thud", "an engine hum"]

[[sound]]
file = "preset:key_pickup"
true = ["a short bright game pickup sound"]
wrong = ["an explosion", "wind blowing", "a heavy thud"]

[[sound]]
