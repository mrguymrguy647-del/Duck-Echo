# A harsh coin sound: a loud, long, buzzy saw blip, distorted and
# bitcrushed. Made for the Ear's test set: the harsh half of a soft/harsh
# pair.
version = 0
name = "coin_harsh"
description = "A harsh, buzzy, loud coin sound."

[master]
normalize_lufs = -12

[[layers]]
source = "saw"
envelope = { attack = 0.001, hold = 0.25, decay = 0.4 }
pitch = { start = "B5", arpeggio = { steps = [0, 5], step_time = 0.07, repeat = true } }

[[effects]]
type = "distortion"
drive = 12
kind = "hard"

[[effects]]
type = "bitcrush"
bits = 4
rate = 6000
