# Everything the Duck Ear's installer downloads, with its address, size
# and SHA-256. Built into Duck Echo (crates/duck-echo-tools/src/ear_install.rs),
# so `duck-echo ear install` and the Studio's Settings > Duck Ear use the
# same list. A test checks that the describe models here are the same as
# in ear/duck_ear/catalog.py.

version = 1

# The private Python that uv installs into the Ear's folder.
python = "3.12"

# ---- uv: installs Python and the Ear's packages ------------------------
#
# The wheel from PyPI, which is a zip file with the uv program inside.

[uv]
version = "0.13.9"

[uv.windows-x86_64]
url = "https://files.pythonhosted.org/packages/dd/ef/ceeabf3631117f7354787d9fb1ffe943899e59ed4b887a696ed547e47e76/uv-0.13.9-py3-none-win_amd64.whl"
bytes = 15662317
sha256 = "6a44b2ed8111d2f60d2b92627c5dccda3f7ed7570b18ce115e569cd68c28246b"
inside = "uv-0.13.9.data/scripts/uv.exe"

[uv.linux-x86_64]
url = "https://files.pythonhosted.org/packages/3d/aa/26d64642d808de4a652579ef950d7cd2d37f080a8babf9c67c6b75fc4c3f/uv-0.13.9-py3-none-manylinux_2_17_x86_64.manylinux2014_x86_64.whl"
bytes = 17606939
sha256 = "d7f459fe4fd247d830351c75686d3996ace3c6f3f728eb0e85a30b7ada0cef19"
inside = "uv-0.13.9.data/scripts/uv"

# ---- The score model ---------------------------------------------------
#
# LAION-CLAP, converted to ONNX by ear/convert/convert_clap.py and
# published with a Duck Echo release (the workflow .github/workflows/ear.yml
# makes that release). Each file is checked against the release's
# SHA256SUMS, as the Studio checks its own updates.

[score]
name = "laion-clap-general"
revision = "ada0c23a36c4e8582805bb38fec3905903f18b41"
release = "https://github.com/mrguymrguy647-del/Duck-Echo/releases/download/ear-score-v1"
sums = "SHA256SUMS"
files = ["model.json", "audio.onnx", "text.onnx", "mel_filters.npy", "tokenizer.json", "reference.npy"]
# About this much to download (the exact sizes come with the release).
bytes = 784000000

# ---- llama.cpp: runs a describe model ----------------------------------
#
# Only downloaded to try a describe model (the Ear ships with scores
# only). From GitHub's list of releases, newest first: the newest one
# that holds a file for this PC (llama.cpp's `v1.0.0` holds none, only a
# note naming a nightly build). The file is the one whose name ends as
# written here (`.zip` or `.tar.gz`), checked against the SHA-256 that
# list gives.

[llama]
releases = "https://api.github.com/repos/ggml-org/llama.cpp/releases?per_page=10"
# About this much to download.
bytes = 60000000

[llama.windows-x86_64]
vulkan = "bin-win-vulkan-x64"
cpu = "bin-win-cpu-x64"

[llama.linux-x86_64]
vulkan = "bin-ubuntu-vulkan-x64"
cpu = "bin-ubuntu-x64"

# ---- Describe models ---------------------------------------------------
